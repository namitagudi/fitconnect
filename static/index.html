<style>
:root{--ink:#1e1b4b;--mu:#475569;--ln:rgba(255,255,255,.95);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.01em}button{font:inherit;cursor:pointer;border:0}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#fbfaff}
.aurora i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.55;animation:d1 30s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vmax;height:46vmax;background:#fed7aa;left:-14vmax;top:-12vmax}.aurora i:nth-child(2){width:40vmax;height:40vmax;background:#a5f3fc;right:-12vmax;top:6vmax;animation-name:d2;animation-duration:36s}
.aurora i:nth-child(3){width:40vmax;height:40vmax;background:#ddd6fe;left:28vmax;bottom:-16vmax;animation-duration:40s}.aurora i:nth-child(4){width:28vmax;height:28vmax;background:#fecdd3;left:-6vmax;bottom:6vmax;animation-name:d2;animation-duration:44s}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.16)}}@keyframes d2{to{transform:translate(-8vmax,9vmax) scale(.9)}}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid #efe9ff;box-shadow:0 8px 30px rgba(139,92,246,.06)}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 26px 4px}.logo{font:800 21px 'Plus Jakarta Sans';background:linear-gradient(90deg,#f97316,#ec4899,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.mode{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:#ede9fe;color:#5b21b6}.mode.ad{background:#ffedd5;color:#9a3412}.grow{flex:1}
.acct{position:relative}.avb{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ec4899 60%,#8b5cf6);color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(236,72,153,.25)}
.pop{position:absolute;right:0;top:46px;min-width:210px;background:#fff;border:1px solid #eadff0;border-radius:16px;padding:14px;box-shadow:0 18px 44px rgba(99,102,241,.2);display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu);z-index:40}.pop[hidden]{display:none}.pop b{color:var(--ink)}.pop hr{border:0;border-top:1px solid #f1e7f5;margin:8px 0}
.so{background:none;color:#64748b;font-size:12px;text-align:left;padding:4px 0;text-decoration:underline}.so:hover{color:#be123c}
.tabs{display:flex;gap:3px;overflow-x:auto;padding:4px 22px 10px;scrollbar-width:thin}.tab{flex:none;display:flex;align-items:center;gap:7px;background:none;font-weight:600;font-size:13.5px;color:var(--mu);padding:8px 13px;border-radius:99px;transition:background .25s,transform .2s;white-space:nowrap}
.tab svg{width:18px;height:18px;color:var(--c)}.tab:hover{background:#fff;transform:translateY(-1px)}.tab.on{background:linear-gradient(135deg,#ffedd5,#fbcfe8 55%,#ddd6fe);color:#7c2d12}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:26px 26px 12px}.page{display:flex;flex-direction:column;gap:18px;animation:rise .5s ease both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
h2.pt{font-size:28px}.sub{color:var(--mu);font-size:14px;margin-top:2px}.note{font-size:12px;color:var(--mu)}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:26px;padding:22px;box-shadow:0 14px 40px rgba(139,92,246,.10)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#f97316,#fb7185 35%,#8b5cf6 70%,#06b6d4)}.card h3{font-size:18px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.rw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{border-radius:30px;padding:30px 34px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#fed7aa,#fecdd3 42%,#ddd6fe 75%,#a5f3fc);box-shadow:0 18px 44px rgba(249,115,22,.18);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}.hb{flex:1;min-width:250px;position:relative;z-index:1}.hb h1{font-size:34px}
.ringx{--p:50%;width:150px;height:150px;border-radius:50%;background:conic-gradient(#f97316 0 var(--p),rgba(255,255,255,.85) 0);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;transition:background .6s}
.ringx div{width:114px;height:114px;border-radius:50%;background:#fffaf6;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 24px 'Plus Jakarta Sans'}.ringx small{font:500 12px Inter;color:var(--mu)}
.type{margin:8px 0 14px;font-size:16px;color:#334155;min-height:24px}.caret{display:inline-block;width:2px;height:1.1em;background:#be185d;vertical-align:text-bottom;margin-left:2px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.btn{padding:10px 17px;border-radius:13px;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;font-weight:600;font-size:13px;box-shadow:0 8px 20px rgba(236,72,153,.25);transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(236,72,153,.35)}.btn.alt{background:#fff;color:#6d28d9;border:1px solid #e4dcfb;box-shadow:none}
.tile{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 18px;border:1px solid rgba(255,255,255,.9);transition:transform .25s,box-shadow .25s}.tile:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(139,92,246,.16)}
.tile b{display:block;font:800 24px 'Plus Jakarta Sans';line-height:1.1;margin-top:2px}.tile span{font-size:13px;color:#334155}.ti{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}.ti svg{width:24px;height:24px}
.c-or{background:linear-gradient(135deg,#ffedd5,#ffe4d6)}.c-or .ti{background:linear-gradient(135deg,#fb923c,#ea580c)}.c-cy{background:linear-gradient(135deg,#cffafe,#e0f2fe)}.c-cy .ti{background:linear-gradient(135deg,#22d3ee,#0891b2)}
.c-pu{background:linear-gradient(135deg,#ede9fe,#f3e8ff)}.c-pu .ti{background:linear-gradient(135deg,#a78bfa,#7c3aed)}.c-pe{background:linear-gradient(135deg,#ffe8df,#ffe4e6)}.c-pe .ti{background:linear-gradient(135deg,#fb7185,#e11d48)}.c-la{background:linear-gradient(135deg,#f3e8ff,#e0e7ff)}.c-la .ti{background:linear-gradient(135deg,#c084fc,#6366f1)}
label.f{display:block;font-size:13px;font-weight:600;color:#334155;margin:10px 0 4px}input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #dcd6f0;background:#fff;font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #a5b4fc;outline-offset:1px}.pill{background:rgba(255,255,255,.88);border:1px solid #e5defa;border-radius:99px;padding:8px 14px;font-weight:600;font-size:13px;color:#334155;transition:transform .2s}.pill:hover{transform:translateY(-2px)}.pill.on{background:linear-gradient(135deg,#f97316,#ec4899);border-color:transparent;color:#fff}.pill:disabled{opacity:.45;cursor:not-allowed}
.tag{font-size:11px;font-weight:600;color:#5b21b6;background:#ede9fe;border-radius:99px;padding:3px 9px}.bd{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}.ok{background:#dcfce7;color:#166534}.wn{background:#fef3c7;color:#92400e}.ex2{background:#ffe4e6;color:#9f1239}.dm{background:#ede9fe;color:#5b21b6}
.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}.xc{background:#fff;border:2px solid transparent;border-radius:22px;overflow:hidden;text-align:left;padding:0;box-shadow:0 10px 26px rgba(139,92,246,.10);transition:transform .25s,box-shadow .25s;color:inherit}.xc:hover{transform:translateY(-5px);box-shadow:0 18px 36px rgba(139,92,246,.2)}.xc.on{border-color:#f97316}
.xc .xi{aspect-ratio:4/3;display:block}.xc .xi svg,.xhero svg,.th svg{display:block;width:100%;height:100%}.xb{padding:11px 14px 14px}.xb b{display:block;font:700 15px 'Plus Jakarta Sans'}.mchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.mc1,.mc2{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}.mc1{background:#ffedd5;color:#9a3412}.mc2{background:#ede9fe;color:#5b21b6}
.xd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}@media(max-width:860px){.xd{grid-template-columns:1fr}}.xhero{border-radius:22px;overflow:hidden;aspect-ratio:4/3;max-height:340px}.mdiag{background:#fff;border-radius:20px;padding:10px;max-width:340px;margin:6px auto 0}.mdiag svg{display:block;width:100%}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:#334155;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.setrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee8f8;font-size:14px}
.gls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.gl{width:58px;height:80px;border:3px solid #22d3ee;border-top-width:2px;border-radius:7px 7px 20px 20px;position:relative;overflow:hidden;background:rgba(255,255,255,.85);padding:0;transition:transform .2s}.gl:hover{transform:translateY(-3px)}.gl b{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#a5f3fc,#06b6d4);transition:height .5s}.gl.on b{height:86%}
.emo{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.emo button{width:68px;height:68px;border-radius:22px;background:#fff;font-size:34px;border:2px solid transparent;box-shadow:0 8px 20px rgba(139,92,246,.10);transition:transform .2s}.emo button:hover{transform:scale(1.1)}.emo button.on{border-color:#f59e0b;background:#fef3c7}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.vc{background:rgba(255,255,255,.9);border-radius:22px;overflow:hidden;border:1px solid var(--ln)}.th{aspect-ratio:16/9;position:relative}.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.pl i{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}.pl i::after{content:"";border-left:14px solid #f97316;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}.vc .b{padding:11px 14px;font-size:14px;font-weight:600}.vc small{display:block;color:var(--mu);font-weight:400}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}.bars div{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(to top,#f97316,#ec4899 60%,#8b5cf6);position:relative;min-height:4px}.bars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:#334155}.bl{display:flex;gap:8px;font-size:11px;color:var(--mu)}.bl span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 6px;border-bottom:1px solid #eee8f8;text-align:left}th{color:var(--mu)}.scroll{overflow-x:auto}.m{padding:10px 14px;border-radius:16px;font-size:14px;max-width:86%;margin-top:10px}.mu2{background:#ffe4d6;margin-left:auto}.me2{background:#ede9fe}
.foot{position:relative;z-index:1;text-align:center;padding:14px 20px 30px;font-size:12px;color:var(--mu)}.lk{background:none;color:#6d28d9;text-decoration:underline;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#fff;border:1px solid #eadff0;border-radius:14px;padding:11px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(99,102,241,.2);z-index:90;transition:transform .35s}#toast.on{transform:translate(-50%,0)}
.tt{position:fixed;inset:0;z-index:60;pointer-events:none;display:none}.tt.go{display:block}.tt div{position:absolute;inset:0}.t1{clip-path:polygon(0 0,100% 0,0 100%);background:linear-gradient(135deg,#fdba74,#fda4af);animation:a1 1s cubic-bezier(.65,0,.35,1) forwards}.t2{clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,#c4b5fd,#67e8f9);animation:a2 1s cubic-bezier(.65,0,.35,1) forwards}
@keyframes a1{0%{transform:translate(-105%,-105%)}45%,55%{transform:translate(0,0)}100%{transform:translate(105%,105%)}}@keyframes a2{0%{transform:translate(105%,105%)}45%,55%{transform:translate(0,0)}100%{transform:translate(-105%,-105%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tt{display:none!important}.caret{opacity:1}}html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}html.rm .tt{display:none!important}html.rm .caret{opacity:1}
/* ---------- Light blue aurora + gym backdrop (login screen only) ---------- */
#aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;display:block;
  background:linear-gradient(135deg,#f8fbff 0%,#f5f3ff 55%,#fff7f2 100%)}
.orb{display:none}
body.is-auth #mute{display:none}
.ab{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform}
.a1{width:54vmax;height:54vmax;left:-16vmax;top:-20vmax;background:#38bdf8;animation:ab1 26s ease-in-out infinite alternate}
.a2{width:48vmax;height:48vmax;right:-14vmax;top:-12vmax;background:#a78bfa;animation:ab2 32s ease-in-out infinite alternate}
.a3{width:50vmax;height:50vmax;left:-12vmax;bottom:-22vmax;background:#f472b6;animation:ab3 29s ease-in-out infinite alternate}
.a4{width:44vmax;height:44vmax;right:-10vmax;bottom:-18vmax;background:#fb923c;animation:ab4 35s ease-in-out infinite alternate}
@keyframes ab1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,10vmax) scale(1.15)}100%{transform:translate(6vmax,24vmax) scale(.95)}}
@keyframes ab2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-16vmax,14vmax) scale(.9)}100%{transform:translate(-4vmax,26vmax) scale(1.12)}}
@keyframes ab3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(20vmax,-12vmax) scale(1.1)}100%{transform:translate(8vmax,-24vmax) scale(.92)}}
@keyframes ab4{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-18vmax,-8vmax) scale(1.12)}100%{transform:translate(-6vmax,-22vmax) scale(.95)}}
/* login: everything soft blue */
body.is-auth #aurora{background:linear-gradient(180deg,#f3f8ff,#e1efff 60%,#e4f4fd)}
body.is-auth .ab{opacity:.65}
body.is-auth .a1{background:#93c5fd}body.is-auth .a2{background:#7dd3fc}
body.is-auth .a3{background:#bfdbfe}body.is-auth .a4{background:#a5f3fc}
.gymbg{display:none}
body.is-auth .gymbg{display:block;position:absolute;inset:0;width:100%;height:100%}
body.is-auth .authwrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

/* ---------- Glass login card ---------- */
.authcard{width:min(430px,100%);background:#ffffffeb;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid #fff;border-radius:24px;padding:30px 28px 26px;
  box-shadow:0 2px 6px #0f172a0d,0 28px 70px #2563eb30}
.authcard .sp{display:none}
.fxbrand{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 10px 26px #2563eb40}
.fxbrand svg{width:36px;height:36px;fill:#fff}
.authcard h1{font-size:30px;font-weight:700;letter-spacing:-.025em;background:none;color:#0f2a5c;-webkit-text-fill-color:#0f2a5c}
body.is-auth .authcard .sub{min-height:22px;margin:6px 0 14px;color:#475f86;font-size:14.5px;font-weight:500}
.fxcaret{display:inline-block;width:2px;height:1.05em;margin-left:2px;background:#2563eb;vertical-align:-2px;animation:fxblink 1s steps(1) infinite}
@keyframes fxblink{50%{opacity:0}}
.fxpills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.authcard .fxpills span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:#e8f1ffcc;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #fff;
  color:#1d4ed8;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px #2563eb14}
.fxpills svg{width:14px;height:14px;fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.authcard .tabs2{background:#e8f1ff;padding:4px;border-radius:14px;gap:4px}
.authcard .tabs2 button{background:transparent;color:#5b6f94;padding:10px;border-radius:11px}
.authcard .tabs2 button.on{background:#fff;color:#1d4ed8;box-shadow:0 2px 10px #2563eb26}
.authcard label.f{margin:12px 0 5px}
.authcard input,.authcard select{padding:12px 13px;border-color:#cfdcf1;background:#fff}
.authcard input:focus,.authcard select:focus{border-color:#2563eb;box-shadow:0 0 0 4px #2563eb26;outline:0}
.fxpw{position:relative;display:block}
.fxpw input{padding-right:46px}
.fxeye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:none}
.fxeye:hover{background:#e8f1ff}
.fxeye svg{width:18px;height:18px;fill:none;stroke:#5b6f94;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.authcard .btn{width:100%;margin-top:16px;padding:13px 18px;font-size:15px;border-radius:12px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 8px 20px #2563eb40}
.authcard .btn:hover{box-shadow:0 12px 28px #2563eb59}
.authcard .btn.alt{background:#fff;color:#1d4ed8;border:1px solid #cfdcf1;box-shadow:none}

/* ---------- Gym hero (left of the card) ---------- */
body.is-auth .authwrap{gap:clamp(32px,6vw,90px);flex-wrap:nowrap}
.fxhero{display:none;max-width:480px;color:#0f2a5c}
.fxeyebrow{display:inline-block;padding:7px 14px;border-radius:99px;background:#ffffff99;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid #fff;color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 14px #2563eb1a}
.fxhero h2{margin:18px 0 14px;font-family:"Barlow Condensed","Oswald","Arial Narrow",Impact,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(52px,7vw,96px);line-height:.92;letter-spacing:.01em;color:#0f2a5c}
.fxhero h2 em{font-style:normal;color:#2563eb;position:relative;display:inline-block}
.fxhero h2 em::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:8px;border-radius:4px;background:linear-gradient(90deg,#60a5fa,#bfdbfe)}
.fxhero p{margin:22px 0 22px;font-size:16.5px;line-height:1.55;color:#3b5683;max-width:380px}
.fxfeat{display:flex;flex-wrap:wrap;gap:10px}
.fxfeat span{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:#ffffffa6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid #fff;color:#1e3a6e;font-size:13px;font-weight:600;box-shadow:0 6px 18px #2563eb1f}
.fxfeat svg{width:17px;height:17px;fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.authcard{position:relative;overflow:hidden;flex:0 0 auto}
.authcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#60a5fa,#2563eb 60%,#38bdf8)}
@media(min-width:901px){.fxhero{display:block}.fxpills{display:none}}
@media(max-width:900px){body.is-auth .authwrap{flex-direction:column}}

/* ---------- Colourful theme (login) ---------- */
body.is-auth #aurora{background:linear-gradient(135deg,#e6f2ff 0%,#f3ebff 50%,#fff0ea 100%)}
body.is-auth .ab{opacity:.62}

V.chk=async()=>{let d;try{d=await api("GET","/attendance/me")}catch(x){return locked(x)||pg("Check-in","",`<div class="card">${esc(x.message)}</div>`)}

V.att=async()=>{const d=await api("GET","/admin/attendance");return pg("Attendance","Tap a name to check a member in or out.",`<div class="g2"><div class="card"><h3>Today (${d.date})</h3>${d.members.map(m=>`<div class="setrow"><span>${esc(m.name)}${m.check_in?` <span class="note">${m.check_in}${m.check_out?" – "+m.check_out:""}</span>`:""}</span><button class="pill ${m.status==="in"?"on":""}" data-a="atog" data-i="${m.id}">${m.status==="in"?"Check out":"Check in"}</button></div>`).join("")||'<p class="note">No linked members yet.</p>'}</div><div class="card"><h3>Members in — last 14 days</h3>${bars(d.last14.map(x=>x.count),d.last14.map(x=>x.date.slice(8)))}</div></div>`)};

V.set=async()=>{const s=await api("GET","/settings"),ad=ROLE()==="admin";return pg("Settings","",`<div class="g2">${ad?`<div class="card"><h3>Gym</h3><label class="f" for="st-n">Gym name</label><input id="st-n" type="text" maxlength="60" value="${esc(s.gym_name)}"><p class="note" style="margin-top:8px">Membership reminders are sent automatically 7, 3, 1 and 0 days before expiry, and after it.</p><button class="btn" style="margin-top:14px" data-a="setsave">Save</button></div>`:""}<div class="card"><h3>Change password</h3><label class="f" for="pw-c">Current password</label><input id="pw-c" type="password" autocomplete="current-password"><label class="f" for="pw-n">New password</label><input id="pw-n" type="password" autocomplete="new-password"><p class="note">At least 8 characters, with letters and numbers.</p><button class="btn alt" style="margin-top:12px" data-a="pwchange">Change password</button></div></div><p class="note" style="text-align:center"><button class="so" data-a="signout">Sign out</button></p>`)};

    '<span><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>AI coach chat</span>' +
    '<span><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/></svg>Progress</span>';
var HERO =
    '<div class="fxhero"><span class="fxeyebrow">Strength &middot; Cardio &middot; Recovery</span>' +
    '<h2>Build<br>a stronger<br><em>you.</em></h2>' +
    '<p>Your workouts, meals and check-ins, together in one place.</p>' +
    '<div class="fxfeat">' + FEAT + '</div></div>';

let LM="login";
function loginRender(){const r=LM==="register";$("authwrap").innerHTML=HERO+`<div class="authcard"><div class="fxbrand">${MARK}</div><h1>Fit Connect</h1><p class="sub"><span id="tag2"></span><span class="caret"></span></p><div class="fxpills">${PILLS}</div>
<div class="tabs2"><button data-m="login" class="${r?"":"on"}">Sign in</button><button data-m="register" class="${r?"on":""}">Create account</button></div>
<form id="af" novalidate>${r?'<label class="f" for="an">Full name</label><input id="an" type="text" autocomplete="name">':""}<label class="f" for="ae">Email</label><input id="ae" type="email" autocomplete="email"><label class="f" for="ap">Password</label><span class="fxpw"><input id="ap" type="password" autocomplete="${r?"new-password":"current-password"}"><button type="button" class="fxeye" id="eye" aria-label="Show password">${EYE}</button></span>${r?'<p class="note">At least 8 characters, with letters and numbers.</p><label class="f" for="ac">Subscription code <span style="font-weight:400;color:#64748b">(optional)</span></label><input id="ac" type="text" placeholder="FIT-XXXX-XXXX"><label class="f" style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input id="acons" type="checkbox" style="width:auto;margin-top:3px"> I agree to let my trainer see my progress (needed if you enter a code)</label>':""}<div class="err" id="aerr"></div><button class="btn" id="asub">${r?"Create account":"Sign in"}</button></form></div>`;typing($("tag2"),TAGS)}
function showLogin(){if(!$("aurora").querySelector(".gymbg"))$("aurora").insertAdjacentHTML("beforeend",GYM);$("pop").hidden=true;document.body.classList.add("is-auth");$("login").hidden=false;LM="login";loginRender()}
$("authwrap").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.m){LM=t.dataset.m;loginRender()}else if(t.id==="eye"){const p=$("ap"),s=p.type==="password";p.type=s?"text":"password";t.setAttribute("aria-label",s?"Hide password":"Show password")}});
$("authwrap").addEventListener("submit",async e=>{e.preventDefault();const er=$("aerr"),em=val("ae"),pw=$("ap").value;er.textContent="";
if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent="Enter a valid email address.";if(!pw)return er.textContent="Enter your password.";
const bt=$("asub");bt.disabled=true;
try{let m;if(LM==="register"){const code=val("ac");m=await api("POST","/auth/register",{name:val("an"),email:em,password:pw,code:code||undefined,consent:code?$("acons").checked:undefined})}else m=await api("POST","/auth/login",{email:em,password:pw});enter(m);toast("Welcome to Fit Connect")}catch(x){er.textContent=x.message;bt.disabled=false}});
(async()=>{try{enter(await api("GET","/me"))}catch(e){showLogin()}})();

</script></body></html>
